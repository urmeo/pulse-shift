<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1160" viewBox="0 0 1040 1160" role="img" aria-labelledby="title description">
  <title id="title">PulseShift: shared data, two model paths</title>
  <desc id="description">Public rides, weather and AQI become an hourly panel and shared training-fitted labels. Historical models fit 2022–2023, predict held-out 2024 and evaluate predictions. A separate model refits all active hours, exports parameters and scores manual or DC forecast inputs. The blue allocation strip uses the recorded training and test hour counts.</desc>
  <metadata>{&quot;counts_and_scores&quot;: &quot;results/tables/summary.json&quot;, &quot;sha256&quot;: &quot;ad37df253a4a5459d12d6119565b362b58232804aead88028fcbf4c40aa2fe0b&quot;, &quot;scope&quot;: &quot;Historical scores use the 2022\u20132023 fit evaluated on 2024; browser parameters are a separate refit.&quot;}</metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1040" height="1160" rx="16" fill="#ffffff"/>
  <g font-family="Arial, sans-serif" fill="#0f172a">
    <text x="40" y="48" font-size="32" fill="#0f172a" font-weight="700">Shared data, two model paths</text>
    <text x="40" y="82" font-size="20" fill="#334155">PulseShift · DC bike-share demand · 2022–2024</text>
    <g id="public-sources">
    <rect x="40" y="120" width="304" height="174" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="64" y="158" font-size="23" fill="#0f172a" font-weight="700">1. Public sources</text>
    <text x="64" y="198" font-size="20" fill="#334155">Capital Bikeshare rides</text>
    <text x="64" y="232" font-size="20" fill="#334155">NOAA DCA weather</text>
    <text x="64" y="266" font-size="20" fill="#334155">CAMS AQI + EPA fallback</text>
    </g>
    <path d="M344 208 H360" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g id="hourly-panel">
    <rect x="368" y="120" width="304" height="174" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="392" y="158" font-size="23" fill="#0f172a" font-weight="700">2. Hourly panel</text>
    <text x="392" y="204" font-size="28" fill="#0f172a" font-weight="700">26,288 records</text>
    <text x="392" y="240" font-size="20" fill="#334155">Join by UTC hour</text>
    <text x="392" y="272" font-size="19" fill="#334155">DC calendar · 2022–2024</text>
    </g>
    <path d="M672 208 H688" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g id="target-and-features">
    <rect x="696" y="120" width="304" height="174" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="720" y="158" font-size="23" fill="#0f172a" font-weight="700">3. Target + features</text>
    <text x="720" y="194" font-size="20" fill="#334155">Expected rides ≥20</text>
    <text x="720" y="224" font-size="20" fill="#334155">Rides &lt;50% of expected</text>
    <text x="720" y="254" font-size="22" fill="#0f172a" font-weight="700">24,354 active hours</text>
    <text x="720" y="280" font-size="19" fill="#334155">12 model features</text>
    </g>
    <text x="40" y="330" font-size="20" fill="#334155">Expected counts use the 2022–2023 baseline in both paths.</text>
    <path d="M848 294 V354 H272" fill="none" stroke="#64748b" stroke-width="2.5"/>
    <path d="M272 354 V390" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M768 354 V390" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g id="historical-evaluation">
    <rect x="40" y="398" width="464" height="664" rx="12" fill="#f4f8ff" stroke="#bfdbfe"/>
    <text x="64" y="438" font-size="23" fill="#1d4ed8" font-weight="700">A. Historical evaluation</text>
    <text x="64" y="466" font-size="18" fill="#1d4ed8">Model comparison and uncertainty</text>
    <rect x="64" y="490" width="416" height="98" rx="12" fill="#ffffff" stroke="#bfdbfe"/>
    <rect x="64" y="620" width="416" height="98" rx="12" fill="#ffffff" stroke="#bfdbfe"/>
    <rect x="64" y="750" width="416" height="126" rx="12" fill="#ffffff" stroke="#bfdbfe"/>
    <rect x="64" y="902" width="416" height="146" rx="12" fill="#ffffff" stroke="#bfdbfe"/>

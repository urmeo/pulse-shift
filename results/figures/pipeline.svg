    <path d="M272 718 V742" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M272 876 V894" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="88" y="524" font-size="22" fill="#0f172a" font-weight="700">Fit five model variants</text>
    <text x="88" y="558" font-size="20" fill="#334155">2022–2023 · 16,150 hours</text>
    <text x="88" y="654" font-size="22" fill="#0f172a" font-weight="700">Predict held-out 2024</text>
    <text x="88" y="688" font-size="20" fill="#334155">8,204 test hours</text>
    <text x="88" y="784" font-size="22" fill="#0f172a" font-weight="700">Evaluate predictions</text>
    <text x="88" y="818" font-size="18" fill="#334155">ROC · precision–recall · calibration</text>
    <text x="88" y="850" font-size="18" fill="#334155">Unweighted: whole-day intervals</text>
    <text x="88" y="930" font-size="18" fill="#1d4ed8" font-weight="700">Recorded evaluation</text>
    <rect x="88" y="946" width="244.034" height="14" rx="0" fill="#2563eb" stroke="none"/>
    <rect x="332.034" y="946" width="123.96600000000001" height="14" rx="0" fill="#93c5fd" stroke="none"/>
    <text x="88" y="984" font-size="18" fill="#334155">16,150 train</text>
    <text x="350" y="984" font-size="18" fill="#334155">8,204 test</text>
    <text x="88" y="1010" font-size="17" fill="#334155">Unweighted: AUROC 0.936 · AP 0.488</text>
    <text x="88" y="1032" font-size="17" fill="#334155">Brier 0.021</text>
    </g>
    <g id="browser-estimates">
    <rect x="536" y="398" width="464" height="664" rx="12" fill="#f1fbf8" stroke="#99d6c8"/>
    <text x="560" y="438" font-size="23" fill="#0f766e" font-weight="700">B. Browser estimates</text>
    <text x="560" y="466" font-size="18" fill="#0f766e">A separate all-years model fit</text>
    <rect x="560" y="490" width="416" height="98" rx="12" fill="#ffffff" stroke="#99d6c8"/>
    <rect x="560" y="620" width="416" height="98" rx="12" fill="#ffffff" stroke="#99d6c8"/>
    <rect x="560" y="750" width="416" height="126" rx="12" fill="#ffffff" stroke="#99d6c8"/>
    <rect x="560" y="902" width="416" height="146" rx="12" fill="#ffffff" stroke="#99d6c8"/>
    <path d="M768 588 V612" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M768 718 V742" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="584" y="524" font-size="22" fill="#0f172a" font-weight="700">Refit unweighted logistic</text>
    <text x="584" y="558" font-size="20" fill="#334155">All 24,354 active hours</text>
    <text x="584" y="652" font-size="21" fill="#0f172a" font-weight="700">Export browser parameters</text>
    <text x="584" y="684" font-size="19" fill="#334155">Scaler, weights and intercept</text>
    <text x="584" y="706" font-size="17" fill="#0f766e">app/model.js</text>
    <text x="584" y="784" font-size="22" fill="#0f172a" font-weight="700">Estimate low-demand chance</text>
    <text x="584" y="818" font-size="19" fill="#334155">Manual inputs → one estimate</text>
    <text x="584" y="850" font-size="19" fill="#334155">DC forecast → compare hours</text>
    <text x="584" y="930" font-size="19" fill="#0f766e" font-weight="700">Forecast comparison</text>
    <text x="584" y="960" font-size="18" fill="#334155">Next 24 h · 06:00–21:00 DC</text>
    <text x="584" y="990" font-size="17" fill="#334155">Complete inputs · heat index &lt;103°F</text>
    <text x="584" y="1018" font-size="17" fill="#334155">AQI &lt;150 · live accuracy unmeasured</text>
    </g>
    <text x="40" y="1104" font-size="18" fill="#334155">Test scores describe historical evaluation; the browser uses a separate refit.</text>
    <text x="40" y="1134" font-size="18" fill="#334155">Historical shifts are simulations. AQI and Seoul analyses are detailed in the guide.</text>
  </g>
</svg>
